<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieLimpio Player</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Inter',sans-serif;overflow:hidden}
    video{width:100%;height:100vh;object-fit:contain;background:#000}
    .loading{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:#000;color:#666;z-index:10}
    .spinner{width:40px;height:40px;border:3px solid #222;border-top-color:#00b4d8;border-radius:50%;animation:s .8s linear infinite;margin-right:12px}
    @keyframes s{to{transform:rotate(360deg)}}
    .loading-content{display:flex;align-items:center}
  </style>
</head>
<body>
  <div class="loading" id="loading"><div class="loading-content"><div class="spinner"></div><span>Cargando stream...</span></div></div>
  <video id="hlsPlayer" controls autoplay playsinline></video>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const sid=window.location.pathname.split('/').pop(),pl=`/api/stream/${sid}/playlist.m3u8`,v=document.getElementById('hlsPlayer'),ld=document.getElementById('loading');
    if(Hls.isSupported()){const h=new Hls({enableWorker:true,lowLatencyMode:false,backbufferLength:30,maxBufferLength:60,startLevel:-1,capLevelToPlayerSize:true});h.loadSource(pl);h.attachMedia(v);h.on(Hls.Events.MANIFEST_PARSED,()=>{ld.style.display='none';v.play().catch(()=>{})});h.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)ld.innerHTML='<div style="color:#ff4444;text-align:center"><p>Error</p><small style="color:#888">'+d.details+'</small></div>'})}
    else if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=pl;v.addEventListener('loadedmetadata',()=>{ld.style.display='none';v.play().catch(()=>{})})}
  </script>
</body>
</html>
